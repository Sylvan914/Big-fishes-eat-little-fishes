<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>大鱼吃小鱼</title>
<style>
  :root{ --sea1:#54c6e8; --sea2:#0d6ea3; --deep:#0a3d63; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b5f8f;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  #game{display:block;position:absolute;inset:0}

  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;
    color:#eaf6ff;text-align:center;z-index:10;padding:18px;
    background:radial-gradient(ellipse at 50% 12%, rgba(64,180,220,.22), rgba(6,42,72,.56));
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    transition:opacity .3s ease;
  }
  .overlay.hidden{opacity:0;pointer-events:none}
  h1.title{
    font-size:clamp(40px,10vw,68px);letter-spacing:4px;font-weight:900;
    background:linear-gradient(180deg,#ffffff,#aef0ff 50%,#42c4ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 18px rgba(0,180,255,.45));
  }
  .subtitle{font-size:15px;color:#dff6ff;letter-spacing:2px;margin-top:-8px;text-shadow:0 1px 4px rgba(0,28,50,.55)}
  .btn{
    position:relative;overflow:hidden;
    min-width:230px;padding:15px 32px;font-size:20px;font-weight:800;letter-spacing:3px;
    color:#fff;border:none;border-radius:999px;cursor:pointer;
    background:linear-gradient(135deg,#35c0ff,#0a86e8);
    box-shadow:0 8px 22px rgba(0,150,255,.45), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,40,90,.18);
    transition:transform .14s ease, box-shadow .14s ease, filter .14s ease;
  }
  .btn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 14px 30px rgba(0,160,255,.6), inset 0 2px 0 rgba(255,255,255,.4), inset 0 -3px 0 rgba(0,40,90,.18)}
  .btn:active{transform:translateY(1px) scale(.98);box-shadow:0 4px 12px rgba(0,150,255,.4), inset 0 2px 0 rgba(255,255,255,.3)}
  .btn.secondary{background:linear-gradient(135deg,#3ee08a,#0fb56a);box-shadow:0 8px 22px rgba(0,220,130,.4), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,80,40,.18)}
  .btn.ghost{background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 2px rgba(255,255,255,.30)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;filter:grayscale(.5)}
  .btn-mini{min-width:0;padding:9px 20px;font-size:15px;letter-spacing:1px}
  .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:ripple .6s ease-out;pointer-events:none}
  @keyframes ripple{to{transform:scale(2.7);opacity:0}}
  .card{
    background:rgba(8,50,82,.58);border:1px solid rgba(150,220,255,.30);
    border-radius:20px;padding:20px 26px;max-width:620px;
    box-shadow:0 12px 40px rgba(0,20,40,.35);line-height:1.9;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  }
  .card h3{font-size:21px;margin-bottom:8px;color:#8fe4ff;letter-spacing:3px}
  .card .keys{display:inline-block;min-width:26px;padding:1px 9px;margin:0 2px;border-radius:8px;
    background:rgba(28,120,180,.45);border:1px solid rgba(140,215,255,.4);font-weight:700;color:#dff4ff}
  .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .hint{font-size:13px;color:#bfe9f7}
  .muted{font-size:13px;color:#cfeaf7;text-shadow:0 1px 4px rgba(0,28,50,.55)}
  .fish-legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
  .fish-legend .dot{display:flex;align-items:center;gap:6px;font-size:13px;color:#dff4ff;background:rgba(20,80,120,.55);padding:4px 12px;border-radius:20px}
  .fish-legend .dot i{width:14px;height:14px;border-radius:50%;display:inline-block;box-shadow:0 0 8px currentColor}

  .select-grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:820px;margin:0 auto}
  .fish-card{position:relative;width:140px;background:rgba(8,50,82,.6);border:2px solid rgba(150,220,255,.28);
    border-radius:18px;padding:12px 8px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);box-shadow:0 6px 18px rgba(0,20,40,.28);
    transition:border-color .18s,box-shadow .18s,transform .14s}
  .fish-card:hover{transform:translateY(-4px);border-color:rgba(180,235,255,.6)}
  .fish-card:active{transform:scale(.96)}
  .fish-card canvas{width:120px;height:88px;display:block;pointer-events:none}
  .fish-card .name{font-size:14px;font-weight:700;color:#f2fbff}
  .fish-card .tag{font-size:11px;color:#a9d8ee}
  .fish-card .badge{position:absolute;top:-9px;right:-7px;font-size:11px;font-weight:800;padding:1px 8px;border-radius:10px;
    background:rgba(10,60,95,.9);color:#ffd23f;border:1px solid rgba(255,210,63,.6);box-shadow:0 2px 8px rgba(0,0,0,.35);min-width:26px;text-align:center}
  .fish-card .badge:empty{display:none}
  .fish-card.p1{border-color:#ffd23f;box-shadow:0 0 0 2px rgba(255,210,63,.35), 0 0 22px rgba(255,210,63,.6)}
  .fish-card.p2{border-color:#24c26d;box-shadow:0 0 0 2px rgba(36,194,109,.35), 0 0 22px rgba(36,194,109,.6)}
  #selectPlayers .btn.active{background:linear-gradient(135deg,#35c0ff,#0a86e8);box-shadow:0 6px 16px rgba(0,150,255,.5)}
  #select{overflow-y:auto;padding:18px}

  @media (max-width:480px){
    h1.title{letter-spacing:2px}
    .subtitle{font-size:13px}
    .btn{min-width:200px;padding:13px 24px;font-size:18px}
    .card{max-width:92%;padding:16px 18px}
    .fish-card{width:104px;padding:9px 6px 8px;gap:3px}
    .fish-card canvas{width:88px;height:64px}
    .fish-card .name{font-size:12px}
    .overlay{gap:12px}
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- 主菜单 -->
<div class="overlay" id="menu">
  <h1 class="title">大鱼吃小鱼</h1>
  <div class="subtitle">吃掉小鱼 · 躲避大鱼 · 成长为海洋之王</div>
  <div class="row" style="margin-top:8px">
    <button class="btn" id="btnSingle">单人模式</button>
    <button class="btn secondary" id="btnDouble">双人模式</button>
  </div>
  <div class="card">
    <h3>操作说明</h3>
    <div style="text-align:left">
      <div><b style="color:#7fd7ff">单人：</b><span class="keys">W A S D</span> 或 <span class="keys">↑ ← ↓ →</span> 移动，<span class="keys">空格</span> 冲刺</div>
      <div><b style="color:#24c26d">双人：</b>P1 <span class="keys">W A S D</span> + <span class="keys">空格</span> 冲刺 &nbsp;|&nbsp; P2 <span class="keys">↑ ← ↓ →</span> + <span class="keys">Enter</span> 冲刺</div>
      <div class="hint">规则：吃掉比你小的鱼变强；被更大的鱼咬到会掉一条命（共 3 条）；连续吃鱼可叠连击。</div>
    </div>
  </div>
  <div class="card" style="padding:14px 20px">
    <div class="fish-legend" id="legend"></div>
  </div>
  <div class="muted">按 <span class="keys">P</span> 暂停 · <span class="keys">M</span> 静音</div>
</div>

<!-- 暂停 -->
<div class="overlay hidden" id="pause">
  <h1 class="title" style="font-size:48px">已暂停</h1>
  <div class="row">
    <button class="btn" id="btnResume">继续</button>
    <button class="btn ghost" id="btnMenu">返回菜单</button>
  </div>
</div>

<!-- 结束 -->
<div class="overlay hidden" id="gameover">
  <h1 class="title" id="goTitle">游戏结束</h1>
  <div class="subtitle" id="goScore"></div>
  <div class="subtitle" id="goBest"></div>
  <div class="row" style="margin-top:10px">
    <button class="btn" id="btnRestart">再来一局</button>
    <button class="btn ghost" id="btnMenu2">返回菜单</button>
  </div>
</div>

<!-- 选鱼 -->
<div class="overlay hidden" id="select">
  <h1 class="title" style="font-size:40px" id="selectTitle">选择你的鱼</h1>
  <div class="subtitle" id="selectSubtitle"></div>
  <div class="row" id="selectPlayers" style="display:none;margin-bottom:4px">
    <button class="btn ghost btn-mini" id="btnPickP1">P1 选择</button>
    <button class="btn ghost btn-mini" id="btnPickP2">P2 选择</button>
  </div>
  <div class="select-grid" id="selectGrid"></div>
  <div class="row" style="margin-top:8px">
    <button class="btn" id="btnConfirm">开始游戏</button>
    <button class="btn ghost" id="btnSelectBack">返回菜单</button>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   大鱼吃小鱼 · 经典街机版（上下左右移动，鱼从两侧游入）
   ============================================================ */

/* ---------- 工具 ---------- */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ---------- 音效 (Web Audio) ---------- */
const AudioSys = {
  ctx: null, muted: false,
  ensure() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur, type = 'sine', vol = 0.2, slideTo = null) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  eat(size) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime;
    const f0 = lerp(420, 210, clamp(size / 120, 0, 1));
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f0 * 0.9, t);
    o.frequency.exponentialRampToValueAtTime(f0 * 1.5, t + 0.045);
    o.frequency.exponentialRampToValueAtTime(f0 * 0.45, t + 0.13);
    g.gain.setValueAtTime(0.2, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(g).connect(this.ctx.destination);
    o.start(t); o.stop(t + 0.17);
  },
  dash() { this.tone(300, 0.18, 'sawtooth', 0.08, 620); },
  hurt() { this.tone(240, 0.32, 'sine', 0.2, 80); },
  over() { this.tone(400, 0.5, 'sawtooth', 0.16, 90); },
  click() { this.tone(700, 0.06, 'triangle', 0.12); },
};

/* ---------- 鱼种定义 ---------- */
// body: round | tall | eel | shark | sword | long | koi | plump
// pattern: null | 'band' | 'stripe' | 'spot' | 'tailbar'
const SPECIES = [
  { id:'blue',   name:'蓝色小鱼', body:'round',  c1:'#3fa7ff', c2:'#2a6df4', belly:'#dff1ff', pattern:null,    sizeMin:10, sizeMax:30, speed:1.5,  value:2,  agg:0 },
  { id:'flesh',  name:'肉色小鱼', body:'tall',   c1:'#ffcfa8', c2:'#f5a97f', belly:'#ffe9d6', pattern:null,    sizeMin:15, sizeMax:40, speed:1.4,  value:3,  agg:0 },
  { id:'koi',    name:'红色金鲤', body:'koi',    c1:'#ff5a4e', c2:'#ff8a3d', belly:'#ffe0c0', pattern:'band',   sizeMin:25, sizeMax:50, speed:1.0,  value:6,  agg:0 },
  { id:'ribbon', name:'黑黄带鱼', body:'eel',    c1:'#2e2e2e', c2:'#171717', belly:'#ffd23f', pattern:'stripe', patColor:'rgba(255,210,63,.95)', sizeMin:40, sizeMax:70, speed:1.2, value:10, agg:0.5 },
  { id:'yellow', name:'浅黄鱼',   body:'plump',  c1:'#ffe9a8', c2:'#ffd75e', belly:'#fffbe0', pattern:null,    sizeMin:50, sizeMax:80, speed:0.95, value:8,  agg:0 },
  { id:'black',  name:'大黑鱼',   body:'long',   c1:'#3a3f46', c2:'#1c1f24', belly:'#8a919a', pattern:null,    eyeScale:0.55, sizeMin:70, sizeMax:100, speed:0.85, value:16, agg:0.6 },
  { id:'tuna',   name:'蓝金枪鱼', body:'sword',  c1:'#2e6bb8', c2:'#1e4f8f', belly:'#dce9f7', pattern:null,    sizeMin:90, sizeMax:125, speed:1.3,  value:26, agg:0.8 },
  { id:'shark',  name:'深蓝鲨鱼', body:'shark',  c1:'#1e3a5f', c2:'#14294a', belly:'#cfe0f0', pattern:null,    eye:'#ff2b2b', sizeMin:110, sizeMax:150, speed:1.15, value:45, agg:1 },
];

/* ---------- Canvas ---------- */
const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d');
let fishLayer = document.createElement('canvas');
let fishCtx = fishLayer.getContext('2d');
let FISH_W = 720, FISH_H = 480;
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fishLayer.width = FISH_W * DPR; fishLayer.height = FISH_H * DPR;
  fishCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

/* ---------- 输入（纯键盘，上下左右） ---------- */
const Input = {
  keys: {},
  mode: 'single',
  reset() { this.keys = {}; },
  playerVector(p) {
    let x = 0, y = 0;
    const single = this.mode === 'single';
    if (single || p === 0) {
      if (this.keys['KeyW']) y -= 1;
      if (this.keys['KeyS']) y += 1;
      if (this.keys['KeyA']) x -= 1;
      if (this.keys['KeyD']) x += 1;
    }
    if (single || p === 1) {
      if (this.keys['ArrowUp']) y -= 1;
      if (this.keys['ArrowDown']) y += 1;
      if (this.keys['ArrowLeft']) x -= 1;
      if (this.keys['ArrowRight']) x += 1;
    }
    if (x !== 0 && y !== 0) { x *= 0.7071; y *= 0.7071; }
    return { x, y };
  },
  dashPressed(p) { return p === 0 ? this._consume('Space') : this._consume('Enter'); },
  _consume(code) { if (this.keys[code]) { this.keys[code] = false; return true; } return false; },
};

window.addEventListener('keydown', e => {
  if (e.code === 'KeyM') { AudioSys.muted = !AudioSys.muted; AudioSys.ensure(); return; }
  if (e.code === 'KeyP' && Game.state === 'play') { Game.pause(); return; }
  if (e.code === 'KeyP' && Game.state === 'pause') { Game.resume(); return; }
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  Input.keys[e.code] = true;
  AudioSys.ensure();
});
window.addEventListener('keyup', e => { Input.keys[e.code] = false; });

/* ---------- 粒子 ---------- */
const particles = [];
function spawnParticles(x, y, color, n, spread = 3, life = 0.5, size = 3) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(0.5, spread * 40);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(life * 0.5, life), max: life, color, size: rand(size * 0.5, size * 1.6) });
  }
}

/* ---------- 背景气泡 ---------- */
const bubbles = [];
function initBubbles() {
  bubbles.length = 0;
  for (let i = 0; i < 44; i++) {
    bubbles.push({ x: rand(0, W), y: rand(0, H), r: rand(1.5, 7), sp: rand(18, 60), drift: rand(-8, 8), ph: rand(0, TAU) });
  }
}
initBubbles();

// 吃掉小鱼时喷出一串上升的气泡（泡泡粒子特效）
function spawnBubbleBurst(x, y) {
  for (let i = 0; i < 10; i++) {
    bubbles.push({ x: x + rand(-14, 14), y: y + rand(-8, 8), r: rand(1.5, 5), sp: rand(50, 110), drift: rand(-18, 18), ph: rand(0, TAU) });
  }
}

/* ---------- 鱼实体 ---------- */
let fishId = 0;
class Fish {
  constructor(species, x, y, size) {
    this.id = fishId++;
    this.species = species;
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.size = size;
    this.dir = 1; // 1=朝右, -1=朝左
    this.tailPhase = rand(0, TAU);
    this.alive = true;
    this.isPlayer = false;
    this.playerIndex = -1;
    this.score = 0;
    this.lives = 3;
    this.invincibleUntil = 0;
    this.dashCooldown = 0;
    this.dashTimer = 0;
    this.combo = 0; this.comboTime = 0;
    this.kills = 0;
    this.hueShift = rand(-8, 8);
    this.trail = [];
  }

  update(dt) {
    this.tailPhase += dt * (5 + this.vx * 0.02);
    if (this.dashTimer > 0) this.dashTimer -= dt;
    if (this.dashCooldown > 0) this.dashCooldown -= dt;
    if (this.invincibleUntil > 0) this.invincibleUntil -= dt;
    if (this.comboTime > 0) { this.comboTime -= dt; if (this.comboTime <= 0) this.combo = 0; }
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 8) this.trail.shift();
  }

  aiSpeed() {
    return lerp(100, 55, clamp((this.size - 8) / 140, 0, 1)) * this.species.speed;
  }

  aiUpdate(dt) {
    this.vx = this.dir * this.aiSpeed();
    this.vy = 0;
    this.x += this.vx * dt;
  }
}

/* ---------- 玩家移动 ---------- */
function updatePlayer(p, dt) {
  const v = Input.playerVector(p.playerIndex);
  let spd = lerp(230, 185, clamp((p.size - 18) / 120, 0, 1));
  if (p.dashTimer > 0) spd *= 2.2;

  p.vx = v.x * spd;
  p.vy = v.y * spd;
  if (v.x > 0) p.dir = 1;
  else if (v.x < 0) p.dir = -1;

  p.x += p.vx * dt;
  p.y += p.vy * dt;
  p.x = clamp(p.x, p.size + 6, W - p.size - 6);
  p.y = clamp(p.y, p.size + 6, H - p.size - 6);

  if (Input.dashPressed(p.playerIndex) && p.dashCooldown <= 0) {
    p.dashTimer = 0.26; p.dashCooldown = 1.4;
    AudioSys.dash();
    spawnParticles(p.x - p.dir * p.size, p.y, '#bff0ff', 8, 1, 0.4, 3);
  }
}

/* ---------- 游戏主控 ---------- */
const Game = {
  state: 'menu',
  mode: 'single',
  players: [],
  fishes: [],
  time: 0,
  best: { single: 0, double: 0 },
  select: { mode: 'single', picks: [null, null], player: 0 },

  init() {
    try {
      const b = JSON.parse(localStorage.getItem('bigfish_best') || '{}');
      if (b.single) this.best.single = b.single;
      if (b.double) this.best.double = b.double;
    } catch (e) {}
    this.buildLegend();
  },

  buildLegend() {
    const el = document.getElementById('legend');
    el.innerHTML = '';
    for (const s of SPECIES) {
      const d = document.createElement('span');
      d.className = 'dot';
      d.innerHTML = `<i style="background:${s.c1};color:${s.c1}"></i>${s.name}`;
      el.appendChild(d);
    }
  },

  start(mode) {
    this.mode = mode;
    Input.mode = mode;
    Input.reset();
    particles.length = 0;
    this.time = 0;
    this.players = [];
    this.fishes = [];

    const createPlayer = (idx, x, y) => {
      const sid = this.select.picks[idx] || (idx === 0 ? 'blue' : 'yellow');
      const sp = SPECIES.find(s => s.id === sid) || SPECIES[0];
      const p = new Fish(sp, x, y, 18);
      p.isPlayer = true; p.playerIndex = idx;
      return p;
    };

    if (mode === 'single') {
      this.players.push(createPlayer(0, W / 2, H / 2));
    } else {
      this.players.push(createPlayer(0, W / 2 - 120, H / 2));
      this.players.push(createPlayer(1, W / 2 + 120, H / 2));
    }

    // 初始鱼群（铺满屏幕）
    for (let i = 0; i < 22; i++) this.spawnFish(false);

    this.state = 'play';
    this.showMenu(false); this.showPause(false); this.showGameOver(false);
    AudioSys.ensure(); AudioSys.click();
  },

  pause() { if (this.state !== 'play') return; this.state = 'pause'; this.showPause(true); },
  resume() { if (this.state !== 'pause') return; this.state = 'play'; this.showPause(false); AudioSys.click(); },
  toMenu() { this.state = 'menu'; this.showMenu(true); this.showPause(false); this.showGameOver(false); this.showSelect(false); },

  showMenu(on) { document.getElementById('menu').classList.toggle('hidden', !on); },
  showPause(on) { document.getElementById('pause').classList.toggle('hidden', !on); },
  showGameOver(on) { document.getElementById('gameover').classList.toggle('hidden', !on); },
  showSelect(on) { document.getElementById('select').classList.toggle('hidden', !on); },

  openSelect(mode) {
    this.select.mode = mode;
    this.select.picks = [null, null];
    this.select.player = 0;
    this.buildSelect();
    this.showMenu(false); this.showSelect(true);
    AudioSys.ensure(); AudioSys.click();
  },

  buildSelect() {
    const grid = document.getElementById('selectGrid');
    grid.innerHTML = '';
    for (const s of SPECIES) {
      const card = document.createElement('button');
      card.className = 'fish-card';
      card.dataset.id = s.id;
      const cv = document.createElement('canvas');
      cv.width = 240; cv.height = 176;
      renderFishPreview(cv, s.id);
      const nm = document.createElement('div');
      nm.className = 'name'; nm.textContent = s.name;
      const tg = document.createElement('div');
      tg.className = 'tag';
      tg.textContent = s.sizeMax <= 40 ? '小型' : (s.sizeMax <= 80 ? '中型' : (s.sizeMax <= 125 ? '大型' : '顶级'));
      const bd = document.createElement('div');
      bd.className = 'badge'; bd.textContent = '';
      card.appendChild(cv); card.appendChild(nm); card.appendChild(tg); card.appendChild(bd);
      card.addEventListener('click', () => this.chooseFish(s.id));
      grid.appendChild(card);
    }
    this.updateSelectUI();
  },

  chooseFish(id) {
    this.select.picks[this.select.player] = id;
    AudioSys.click();
    if (this.select.mode === 'double' && this.select.player === 0) this.select.player = 1;
    this.updateSelectUI();
  },

  setSelectPlayer(idx) {
    this.select.player = idx;
    AudioSys.click();
    this.updateSelectUI();
  },

  updateSelectUI() {
    const { mode, picks, player } = this.select;
    document.getElementById('selectTitle').textContent =
      mode === 'single' ? '选择你的鱼' : `玩家 ${player + 1} · 选择你的鱼`;
    document.getElementById('selectSubtitle').textContent =
      mode === 'single' ? '挑一条你喜欢的鱼，点击「开始游戏」出发'
        : '点击鱼卡即为当前玩家选择，可点上方按钮切换重选';
    const players = document.getElementById('selectPlayers');
    players.style.display = mode === 'double' ? '' : 'none';
    document.getElementById('btnPickP1').classList.toggle('active', player === 0);
    document.getElementById('btnPickP2').classList.toggle('active', player === 1);
    const ok = mode === 'single' ? !!picks[0] : !!(picks[0] && picks[1]);
    document.getElementById('btnConfirm').disabled = !ok;

    for (const c of document.querySelectorAll('#selectGrid .fish-card')) {
      const id = c.dataset.id;
      const is1 = picks[0] === id, is2 = picks[1] === id;
      c.classList.toggle('p1', is1);
      c.classList.toggle('p2', is2);
      c.querySelector('.badge').textContent = is1 && is2 ? 'P1·P2' : (is1 ? 'P1' : (is2 ? 'P2' : ''));
    }
  },

  confirmSelect() {
    const { mode, picks } = this.select;
    if (mode === 'single' && !picks[0]) return;
    if (mode === 'double' && (!picks[0] || !picks[1])) return;
    this.showSelect(false);
    this.start(mode);
  },

  spawnFish(fromEdge = true) {
    const maxP = Math.max(...this.players.map(p => p.size), 18);
    let target, species;
    const roll = Math.random();
    if (roll < 0.10) {
      // 大型威胁：明显比玩家大，随玩家体型增长（前期是黄鱼/带鱼/黑鱼，后期才有金枪鱼/鲨鱼）
      const bigs = SPECIES.filter(s => s.sizeMin > maxP * 2);
      species = pick(bigs.length ? bigs : [SPECIES[SPECIES.length - 1]]);
      target = rand(species.sizeMin, species.sizeMax);
    } else {
      if (roll < 0.60) target = rand(7, maxP * 0.8);
      else if (roll < 0.82) target = rand(maxP * 0.8, maxP * 1.05);
      else target = rand(maxP * 1.05, maxP * 1.5);
      target = clamp(target, 7, 150);

      let candidates = SPECIES.filter(s => s.sizeMax >= target * 0.7 && s.sizeMin <= target * 1.6);
      if (!candidates.length) candidates = SPECIES;
      species = pick(candidates);
    }
    const size = clamp(target, species.sizeMin, species.sizeMax);

    let x, y, dir;
    if (fromEdge) {
      const fromLeft = Math.random() < 0.5;
      dir = fromLeft ? 1 : -1;
      x = fromLeft ? -size * 2 : W + size * 2;
      y = rand(size + 20, H - size - 20);
    } else {
      dir = Math.random() < 0.5 ? 1 : -1;
      x = rand(size + 10, W - size - 10);
      y = rand(size + 10, H - size - 10);
    }
    const f = new Fish(species, x, y, size);
    f.dir = dir;
    this.fishes.push(f);
  },

  endGame() {
    this.state = 'over';
    AudioSys.over();
    let scoreText = '', bestText = '';
    if (this.mode === 'single') {
      const p = this.players[0];
      const isBest = p.score > this.best.single;
      if (isBest) this.best.single = Math.floor(p.score);
      scoreText = `得分 ${Math.floor(p.score)} · 吃掉 ${p.kills} 条鱼`;
      bestText = isBest ? '🏆 新纪录！' : `最高纪录 ${this.best.single}`;
      document.getElementById('goTitle').textContent = '游戏结束';
    } else {
      const a = this.players[0], b = this.players[1];
      const total = Math.floor(a.score + (b ? b.score : 0));
      const kills = a.kills + (b ? b.kills : 0);
      const isBest = total > this.best.double;
      if (isBest) this.best.double = total;
      scoreText = `总分 ${total} · 吃掉 ${kills} 条鱼`;
      bestText = isBest ? '🏆 新纪录！' : `最高纪录 ${this.best.double}`;
      document.getElementById('goTitle').textContent = '游戏结束';
    }
    document.getElementById('goScore').textContent = scoreText;
    document.getElementById('goBest').textContent = bestText;
    try { localStorage.setItem('bigfish_best', JSON.stringify(this.best)); } catch (e) {}
    this.showGameOver(true);
  },

  update(dt) {
    if (this.state !== 'play') return;
    this.time += dt;
    dt = Math.min(dt, 0.05);

    for (const p of this.players) {
      p.update(dt);
      if (p.alive) updatePlayer(p, dt);
    }
    for (const f of this.fishes) {
      if (!f.alive) continue;
      f.update(dt);
      f.aiUpdate(dt);
    }

    this.handleEating();
    this.updateParticles(dt);
    this.maintainPopulation();
  },

  handleEating() {
    const alivePlayers = this.players.filter(p => p.alive);
    const allFishes = this.fishes.filter(f => f.alive);

    for (const p of alivePlayers) {
      for (let i = allFishes.length - 1; i >= 0; i--) {
        const f = allFishes[i];
        if (!f.alive) continue;
        const d = dist(p.x, p.y, f.x, f.y);
        const eatR = p.size + f.size * 0.4;
        if (d < eatR && f.size < p.size * 0.92) {
          this.eatFish(p, f);
        } else if (d < p.size * 0.7 + f.size * 0.4 && f.size > p.size * 1.12) {
          this.hurtPlayer(p, f);
        }
      }
    }

    // AI 捕食 AI（轻量生态）
    for (const pred of allFishes) {
      if (!pred.alive || pred.species.agg <= 0) continue;
      for (let i = allFishes.length - 1; i >= 0; i--) {
        const f = allFishes[i];
        if (f === pred || !f.alive) continue;
        if (f.size > pred.size * 0.5) continue;
        if (dist2(pred.x, pred.y, f.x, f.y) < (pred.size + f.size) * (pred.size + f.size) * 0.5) {
          this.removeFish(f);
          if (pred.size < pred.species.sizeMax) pred.size = Math.min(pred.species.sizeMax, pred.size + f.size * 0.02);
          spawnParticles(f.x, f.y, f.species.c2, 4, 0.5, 0.3, 2);
        }
      }
    }
  },

  eatFish(p, f) {
    const value = Math.round(f.species.value * (f.size / 20));
    p.score += value * this.comboMul(p);
    p.kills++;
    p.combo++;
    p.comboTime = 2.2;
    p.size = Math.min(150, p.size + f.size * 0.045);
    this.removeFish(f);
    spawnBubbleBurst(f.x, f.y);
    spawnParticles(f.x, f.y, f.species.c2, 10, 0.6, 0.5, 3);
    spawnParticles(f.x, f.y, '#ffffff', 4, 0.4, 0.3, 2);
    AudioSys.eat(p.size);
  },

  comboMul(p) { return 1 + Math.min(p.combo, 10) * 0.1; },

  hurtPlayer(p, f) {
    if (p.invincibleUntil > 0) return;
    p.lives--;
    p.invincibleUntil = 2.0;
    const a = Math.atan2(p.y - f.y, p.x - f.x);
    p.x += Math.cos(a) * 50; p.y += Math.sin(a) * 50;
    p.x = clamp(p.x, p.size + 6, W - p.size - 6);
    p.y = clamp(p.y, p.size + 6, H - p.size - 6);
    spawnParticles(p.x, p.y, '#ff5a5a', 14, 1, 0.6, 3);
    AudioSys.hurt();
    if (p.lives <= 0) {
      p.alive = false;
      spawnParticles(p.x, p.y, p.species.c1, 30, 1.2, 1, 5);
      if (this.mode === 'single') this.endGame();
      else if (!this.players.some(pl => pl.alive)) this.endGame();
    }
  },

  removeFish(f) {
    f.alive = false;
    const idx = this.fishes.indexOf(f);
    if (idx >= 0) this.fishes.splice(idx, 1);
  },

  updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.life -= dt;
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= 0.94; pt.vy *= 0.94;
      if (pt.life <= 0) particles.splice(i, 1);
    }
  },

  updateBubbles(dt) {
    for (const b of bubbles) {
      b.y -= b.sp * dt;
      b.x += (b.drift + Math.sin(ambientT * 2 + b.ph) * 14) * dt;
      if (b.y < -20) { b.y = H + 20; b.x = rand(0, W); }
      if (b.x < -20) b.x = W + 20;
      if (b.x > W + 20) b.x = -20;
    }
  },

  maintainPopulation() {
    const target = 22;
    // 移除游出屏幕的鱼
    for (let i = this.fishes.length - 1; i >= 0; i--) {
      const f = this.fishes[i];
      if (f.x < -f.size * 3 || f.x > W + f.size * 3) this.fishes.splice(i, 1);
    }
    const maxP = Math.max(...this.players.map(p => p.size), 18);
    const edible = this.fishes.filter(f => f.size < maxP * 0.9).length;
    if (this.fishes.length < target || edible < 10) this.spawnFish(true);
  },
};

/* ============================================================
   渲染
   ============================================================ */
// 在选鱼界面的小画布上渲染鱼的预览（复用 drawFishBody，临时替换全局离屏层）
function renderFishPreview(canvas, speciesId) {
  const sp = SPECIES.find(s => s.id === speciesId) || SPECIES[0];
  const pctx = canvas.getContext('2d');
  const cw = canvas.width, ch = canvas.height;
  pctx.clearRect(0, 0, cw, ch);

  const layer = document.createElement('canvas');
  layer.width = cw; layer.height = ch;
  const lctx = layer.getContext('2d');

  const saved = { ctx, fishLayer, fishCtx, FISH_W, FISH_H };
  ctx = pctx; fishLayer = layer; fishCtx = lctx; FISH_W = cw; FISH_H = ch;

  const f = new Fish(sp, cw / 2, ch / 2, 34);
  f.dir = 1; f.hueShift = 0; f.tailPhase = 0.35;
  drawFishBody(f, 0);

  ctx = saved.ctx; fishLayer = saved.fishLayer; fishCtx = saved.fishCtx; FISH_W = saved.FISH_W; FISH_H = saved.FISH_H;
}

function drawFishBody(f, time) {
  const sp = f.species;
  const s = f.size;

  // 在离屏层绘制鱼身，以便用 destination-out 镂空嘴巴（露出真实背景，而非填色）
  const mainCtx = ctx;
  ctx = fishCtx;
  fishCtx.clearRect(0, 0, FISH_W, FISH_H);
  ctx.save();
  ctx.translate(FISH_W / 2, FISH_H / 2);
  if (f.dir < 0) ctx.scale(-1, 1);
  if (f.isPlayer && f.invincibleUntil > 0 && Math.floor(time * 12) % 2 === 0) ctx.globalAlpha = 0.45;

  const wag = Math.sin(f.tailPhase) * 0.5;

  // 体型比例（半长 L、半高 H，乘以尺寸 s）：拉成长条状
  let Lr, Hr;
  if (sp.body === 'eel')         { Lr = 2.2;  Hr = 0.45; }
  else if (sp.body === 'tall')   { Lr = 1.4;  Hr = 0.8; }
  else if (sp.body === 'shark')  { Lr = 1.4;  Hr = 0.75; }
  else if (sp.body === 'sword')  { Lr = 1.9;  Hr = 0.6; }
  else if (sp.body === 'long')   { Lr = 1.35; Hr = 0.78; }
  else if (sp.body === 'koi')    { Lr = 1.7;  Hr = 0.58; }
  else if (sp.body === 'plump')  { Lr = 1.15; Hr = 0.9; }
  else { Lr = 1.5; Hr = 0.65; }

  const bodyL = Lr * s, bodyH = Hr * s;

  // 尾巴
  const tailX = -bodyL * 0.88;
  const tailW = s * 1.1;
  ctx.fillStyle = shade(sp.c2, f.hueShift);
  if (sp.body === 'eel') {
    ctx.beginPath();
    ctx.moveTo(tailX, 0);
    ctx.lineTo(tailX - s * 1.5, -tailW * 0.5 + wag * 6);
    ctx.lineTo(tailX - s * 1.5, tailW * 0.5 + wag * 6);
    ctx.closePath(); ctx.fill();
  } else if (sp.body === 'koi') {
    // 锦鲤：宽大飘逸的叉尾
    ctx.beginPath();
    ctx.moveTo(tailX, 0);
    ctx.quadraticCurveTo(tailX - s * 0.5, -tailW * 0.5 + wag * 3, tailX - s * 1.05, -tailW * 0.95 + wag * 6);
    ctx.quadraticCurveTo(tailX - s * 0.35, -tailW * 0.12 + wag * 2, tailX - s * 0.25, wag * 1);
    ctx.quadraticCurveTo(tailX - s * 0.35, tailW * 0.12 + wag * 2, tailX - s * 1.05, tailW * 0.95 + wag * 6);
    ctx.quadraticCurveTo(tailX - s * 0.5, tailW * 0.5 + wag * 3, tailX, 0);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(tailX, 0);
    ctx.lineTo(tailX - s * 0.85, -tailW * 0.55 + wag * 5);
    ctx.lineTo(tailX - s * 0.6, wag * 2);
    ctx.lineTo(tailX - s * 0.85, tailW * 0.55 + wag * 5);
    ctx.closePath(); ctx.fill();
  }

  // 身体（上下渐变：顶部深、底部浅色肚皮，增加立体感）
  const bodyGrad = ctx.createLinearGradient(0, -bodyH, 0, bodyH);
  bodyGrad.addColorStop(0, shade(sp.c2, f.hueShift));
  bodyGrad.addColorStop(0.45, shade(sp.c1, f.hueShift));
  bodyGrad.addColorStop(1, shade(sp.belly, f.hueShift));
  ctx.fillStyle = bodyGrad;

  if (sp.body === 'tall') {
    // 高体鱼（鲳鱼/蝴蝶鱼）：菱形盘状身
    ctx.beginPath();
    ctx.moveTo(0, -bodyH);
    ctx.quadraticCurveTo(bodyL, -bodyH * 0.5, bodyL * 0.72, 0);
    ctx.quadraticCurveTo(bodyL, bodyH * 0.5, 0, bodyH);
    ctx.quadraticCurveTo(-bodyL, bodyH * 0.5, -bodyL * 0.72, 0);
    ctx.quadraticCurveTo(-bodyL, -bodyH * 0.5, 0, -bodyH);
    ctx.closePath(); ctx.fill();
    // 高背鳍 + 臀鳍
    ctx.fillStyle = shade(sp.c2, f.hueShift + 10);
    ctx.beginPath(); ctx.moveTo(-bodyL * 0.1, -bodyH * 0.8); ctx.lineTo(0, -bodyH * 1.5); ctx.lineTo(bodyL * 0.22, -bodyH * 0.8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-bodyL * 0.1, bodyH * 0.8); ctx.lineTo(0, bodyH * 1.42); ctx.lineTo(bodyL * 0.22, bodyH * 0.8); ctx.closePath(); ctx.fill();
  } else if (sp.body === 'eel') {
    // 带鱼：细长带状 + 沿背部连续背鳍
    ellipse(0, 0, bodyL, bodyH); ctx.fill();
    ctx.fillStyle = shade(sp.c2, f.hueShift + 3);
    ctx.beginPath();
    ctx.moveTo(bodyL * 0.85, -bodyH * 0.15);
    ctx.quadraticCurveTo(bodyL * 0.3, -bodyH * 0.7, -bodyL * 0.4, -bodyH * 0.8);
    ctx.quadraticCurveTo(-bodyL * 0.85, -bodyH * 0.75, -bodyL * 0.95, -bodyH * 0.25);
    ctx.lineTo(-bodyL * 0.9, -bodyH * 0.02);
    ctx.quadraticCurveTo(-bodyL * 0.5, -bodyH * 0.3, bodyL * 0.2, -bodyH * 0.35);
    ctx.quadraticCurveTo(bodyL * 0.6, -bodyH * 0.3, bodyL * 0.8, 0);
    ctx.closePath(); ctx.fill();
  } else if (sp.body === 'shark') {
    ctx.beginPath();
    ctx.moveTo(bodyL, 0);
    ctx.quadraticCurveTo(0, -bodyH, -bodyL, 0);
    ctx.quadraticCurveTo(0, bodyH, bodyL, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = shade(sp.c2, f.hueShift - 5);
    ctx.beginPath(); ctx.moveTo(-bodyL * 0.15, -bodyH * 0.75); ctx.lineTo(bodyL * 0.05, -bodyH * 1.7); ctx.lineTo(bodyL * 0.45, -bodyH * 0.65); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bodyL * 0.05, bodyH * 0.45); ctx.lineTo(-bodyL * 0.25, bodyH * 1.35); ctx.lineTo(bodyL * 0.3, bodyH * 0.75); ctx.closePath(); ctx.fill();
  } else if (sp.body === 'sword') {
    ctx.beginPath();
    ctx.moveTo(bodyL, 0);
    ctx.quadraticCurveTo(bodyL * 0.3, -bodyH, -bodyL, 0);
    ctx.quadraticCurveTo(bodyL * 0.3, bodyH, bodyL, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = shade(sp.c2, f.hueShift - 5);
    ctx.beginPath(); ctx.moveTo(-bodyL * 0.2, -bodyH * 0.7); ctx.lineTo(bodyL * 0.0, -bodyH * 1.6); ctx.lineTo(bodyL * 0.3, -bodyH * 0.6); ctx.closePath(); ctx.fill();
  } else if (sp.body === 'long') {
    // 黑鱼（鳢）：胖圆筒身 + 扁平钝头 + 长背鳍
    ctx.beginPath();
    ctx.moveTo(bodyL, -bodyH * 0.15);
    ctx.quadraticCurveTo(bodyL * 0.85, -bodyH * 0.6, bodyL * 0.5, -bodyH * 0.85);
    ctx.quadraticCurveTo(-bodyL * 0.1, -bodyH * 1.0, -bodyL * 0.6, -bodyH * 0.75);
    ctx.quadraticCurveTo(-bodyL * 0.95, -bodyH * 0.7, -bodyL * 0.95, -bodyH * 0.25);
    ctx.quadraticCurveTo(-bodyL * 1.05, 0, -bodyL * 0.9, bodyH * 0.25);
    ctx.quadraticCurveTo(-bodyL * 0.9, bodyH * 0.6, -bodyL * 0.55, bodyH * 0.85);
    ctx.quadraticCurveTo(0, bodyH * 1.05, bodyL * 0.5, bodyH * 0.85);
    ctx.quadraticCurveTo(bodyL * 0.85, bodyH * 0.6, bodyL, bodyH * 0.15);
    ctx.closePath(); ctx.fill();
    // 长背鳍
    ctx.fillStyle = shade(sp.c2, f.hueShift + 5);
    ctx.beginPath(); ctx.moveTo(-bodyL * 0.5, -bodyH * 0.6); ctx.quadraticCurveTo(0, -bodyH * 1.2, bodyL * 0.6, -bodyH * 0.55); ctx.closePath(); ctx.fill();
    // 胸鳍
    ctx.beginPath(); ctx.ellipse(0, bodyH * 0.7, s * 0.32, s * 0.17, 0.5, 0, TAU); ctx.fill();
  } else if (sp.body === 'plump') {
    // 浅黄鱼：圆胖身
    ellipse(0, 0, bodyL, bodyH); ctx.fill();
    ctx.fillStyle = shade(sp.c2, f.hueShift + 5);
    ctx.beginPath(); ctx.moveTo(-bodyL * 0.2, -bodyH * 0.68); ctx.quadraticCurveTo(0, -bodyH * 1.12, bodyL * 0.3, -bodyH * 0.62); ctx.closePath(); ctx.fill();
    // 小胸鳍
    ctx.beginPath(); ctx.ellipse(-bodyL * 0.15, bodyH * 0.55, s * 0.25, s * 0.14, 0.5, 0, TAU); ctx.fill();
  } else if (sp.body === 'koi') {
    ellipse(0, 0, bodyL, bodyH); ctx.fill();
    // 背鳍
    ctx.fillStyle = shade(sp.c2, f.hueShift + 5);
    ctx.beginPath(); ctx.moveTo(-bodyL * 0.4, -bodyH * 0.75); ctx.quadraticCurveTo(0, -bodyH * 1.4, bodyL * 0.4, -bodyH * 0.7); ctx.lineTo(bodyL * 0.22, -bodyH * 0.6); ctx.quadraticCurveTo(0, -bodyH * 0.95, -bodyL * 0.25, -bodyH * 0.6); ctx.closePath(); ctx.fill();
    // 胸鳍
    ctx.beginPath(); ctx.ellipse(-bodyL * 0.15, bodyH * 0.55, s * 0.3, s * 0.16, 0.6, 0, TAU); ctx.fill();
    // 触须
    ctx.strokeStyle = shade(sp.c2, f.hueShift);
    ctx.lineWidth = Math.max(1, s * 0.05);
    ctx.beginPath(); ctx.moveTo(bodyL * 0.68, bodyH * 0.02); ctx.quadraticCurveTo(bodyL * 0.86, bodyH * 0.22, bodyL * 0.92, bodyH * 0.38); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bodyL * 0.68, -bodyH * 0.04); ctx.quadraticCurveTo(bodyL * 0.84, -bodyH * 0.18, bodyL * 0.9, -bodyH * 0.32); ctx.stroke();
  } else {
    // 默认长条鱼身
    ellipse(0, 0, bodyL, bodyH); ctx.fill();
    // 背鳍
    ctx.fillStyle = shade(sp.c2, f.hueShift + 6);
    ctx.beginPath(); ctx.moveTo(-bodyL * 0.2, -bodyH * 0.68); ctx.lineTo(0, -bodyH * 1.3); ctx.lineTo(bodyL * 0.28, -bodyH * 0.68); ctx.closePath(); ctx.fill();
    // 胸鳍
    ctx.fillStyle = shade(sp.c2, f.hueShift + 8);
    ctx.beginPath(); ctx.ellipse(-bodyL * 0.05, bodyH * 0.7, s * 0.28, s * 0.15, 0.6, 0, TAU); ctx.fill();
    // 腹鳍
    ctx.beginPath(); ctx.moveTo(-bodyL * 0.12, bodyH * 0.55); ctx.lineTo(-bodyL * 0.3, bodyH * 1.0); ctx.lineTo(-bodyL * 0.0, bodyH * 0.72); ctx.closePath(); ctx.fill();
  }

  // 高光（立体感）
  ctx.save();
  clipBodyShape(sp, bodyL, bodyH);
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.beginPath(); ctx.ellipse(-bodyL * 0.18, -bodyH * 0.5, bodyL * 0.34, bodyH * 0.2, -0.08, 0, TAU); ctx.fill();
  ctx.restore();

  // 花纹
  if (sp.pattern === 'band') {
    ctx.save(); clipBodyShape(sp, bodyL, bodyH); ctx.fillStyle = 'rgba(255,255,255,.85)';
    const bw = s * 0.4;
    ctx.fillRect(bodyL * 0.1, -bodyH * 1.4, bw, bodyH * 2.8);
    ctx.fillRect(-bodyL * 0.5, -bodyH * 1.4, bw, bodyH * 2.8);
    ctx.restore();
  } else if (sp.pattern === 'stripe') {
    ctx.save(); clipBodyShape(sp, bodyL, bodyH);
    ctx.fillStyle = sp.patColor || 'rgba(255,255,255,.8)';
    ctx.fillRect(-bodyL * 1.2, -bodyH * 0.15, bodyL * 2.4, bodyH * 0.3);
    ctx.restore();
  } else if (sp.pattern === 'spot') {
    ctx.save(); clipBodyShape(sp, bodyL, bodyH);
    ctx.fillStyle = 'rgba(60,40,20,.35)';
    for (let i = 0; i < 5; i++) {
      const sx = rand(-bodyL, bodyL), sy = rand(-bodyH, bodyH);
      ctx.beginPath(); ctx.arc(sx, sy, s * 0.14, 0, TAU); ctx.fill();
    }
    ctx.restore();
  } else if (sp.pattern === 'tailbar') {
    ctx.fillStyle = shade(sp.c1, f.hueShift + 30);
    ctx.beginPath(); ctx.moveTo(-bodyL * 0.55, -bodyH * 0.6); ctx.lineTo(-bodyL * 0.9, -bodyH * 0.6); ctx.lineTo(-bodyL * 0.9, bodyH * 0.6); ctx.lineTo(-bodyL * 0.55, bodyH * 0.6); ctx.closePath(); ctx.fill();
  }

  // 嘴巴（V字形开口，中间镂空露出真实背景）
  const mouthX = bodyL * 0.92;
  const hx = mouthX - s * 0.06, hy = bodyH * 0.02;
  const ux = mouthX + s * 0.16, uy = -bodyH * 0.18;
  const lx = mouthX + s * 0.16, ly = bodyH * 0.24;

  // 抠空嘴部（离屏层上做 destination-out，只镂空鱼身，合成后露出真实背景）
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath();
  if (sp.body === 'sword') {
    ctx.moveTo(bodyL * 1.20, -bodyH * 0.04);
    ctx.lineTo(bodyL * 0.50, bodyH * 0.02);
    ctx.lineTo(bodyL * 1.02, bodyH * 0.16);
  } else {
    ctx.moveTo(hx, hy); ctx.lineTo(ux, uy); ctx.lineTo(lx, ly);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();

  if (sp.body === 'sword') {
    // 金枪鱼：尖喙——上颚向前收成锐角尖点，下颚略短
    const cx = bodyL * 0.50, cy = bodyH * 0.02;
    const bx = bodyL * 1.20, by = -bodyH * 0.04;   // 上喙尖
    const jx = bodyL * 1.02, jy = bodyH * 0.16;     // 下颚尖
    ctx.fillStyle = shade(sp.c2, -22);
    // 上喙（锐角三角，尖端朝前上方）
    ctx.beginPath();
    ctx.moveTo(cx, cy - bodyH * 0.14);
    ctx.lineTo(bx, by);
    ctx.lineTo(cx, cy);
    ctx.closePath(); ctx.fill();
    // 下颚（锐角三角，尖端朝前下方）
    ctx.beginPath();
    ctx.moveTo(cx, cy + bodyH * 0.14);
    ctx.lineTo(jx, jy);
    ctx.lineTo(cx, cy);
    ctx.closePath(); ctx.fill();
  } else if (sp.body === 'shark') {
    // 鲨鱼：V形大口 + 上颚尖牙
    ctx.strokeStyle = shade(sp.c2, -25);
    ctx.lineWidth = Math.max(1.3, s * 0.09);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(hx, hy); ctx.lineTo(ux, uy);
    ctx.moveTo(hx, hy); ctx.lineTo(lx, ly);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 6; i++) {
      const t = i / 5;
      const tx = hx + (ux - hx) * t;
      const ty = hy + (uy - hy) * t;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(tx + s * 0.045, ty);
      ctx.lineTo(tx + s * 0.022, ty + s * 0.16);
      ctx.closePath(); ctx.fill();
    }
    ctx.lineCap = 'butt';
  } else if (sp.id === 'black') {
    // 大黑鱼：厚嘴唇 V形轮廓
    ctx.strokeStyle = shade(sp.c2, -25);
    ctx.lineWidth = s * 0.10;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(hx, hy); ctx.lineTo(ux, uy);
    ctx.moveTo(hx, hy); ctx.lineTo(lx, ly);
    ctx.stroke();
    ctx.lineCap = 'butt';
  } else {
    // 普通鱼：V字形轮廓嘴
    ctx.strokeStyle = shade(sp.c2, -30);
    ctx.lineWidth = Math.max(1.3, s * 0.09);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(hx, hy); ctx.lineTo(ux, uy);
    ctx.moveTo(hx, hy); ctx.lineTo(lx, ly);
    ctx.stroke();
    ctx.lineCap = 'butt';
  }

  // 眼睛
  const eScale = sp.eyeScale || 1;
  const eyeX = bodyL * 0.5, eyeY = -bodyH * 0.12;
  const eyeR = s * 0.2 * eScale;
  if (sp.eye) {
    // 特殊眼睛（如鲨鱼红眼）
    ctx.fillStyle = sp.eye;
    ctx.beginPath(); ctx.arc(eyeX, eyeY, eyeR, 0, TAU); ctx.fill();
    ctx.fillStyle = '#12020a';
    ctx.beginPath(); ctx.ellipse(eyeX, eyeY, eyeR * 0.18, eyeR * 0.62, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(eyeX - eyeR * 0.3, eyeY - eyeR * 0.3, eyeR * 0.18, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(eyeX, eyeY, eyeR, 0, TAU); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(eyeX + s * 0.05 * eScale, eyeY, s * 0.11 * eScale, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(eyeX + s * 0.07 * eScale, eyeY - s * 0.04 * eScale, s * 0.04 * eScale, 0, TAU); ctx.fill();
  }

  ctx.restore();
  ctx = mainCtx;
  mainCtx.drawImage(fishLayer, f.x - FISH_W / 2, f.y - FISH_H / 2, FISH_W, FISH_H);

  // 玩家标签
  if (f.isPlayer) {
    ctx.save();
    ctx.translate(f.x, f.y - f.size - 22);
    ctx.fillStyle = f.playerIndex === 0 ? '#ffd23f' : '#24c26d';
    ctx.font = 'bold 16px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText(f.playerIndex === 0 ? 'P1' : 'P2', 0, 0);
    if (f.dashCooldown > 0) {
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.fillRect(-16, 6, 32, 3);
      ctx.fillStyle = '#fff';
      ctx.fillRect(-16, 6, 32 * (1 - f.dashCooldown / 1.4), 3);
    }
    ctx.restore();
  }
}

function shade(hex, amt) {
  const c = hexToRgb(hex);
  const r = clamp(c.r + amt, 0, 255), g = clamp(c.g + amt, 0, 255), b = clamp(c.b + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}
function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return { r: parseInt(h.substring(0, 2), 16), g: parseInt(h.substring(2, 4), 16), b: parseInt(h.substring(4, 6), 16) };
}
function ellipse(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); }
function clipBodyShape(sp, bodyL, bodyH) {
  if (sp.body === 'shark') { ctx.beginPath(); ctx.moveTo(bodyL, 0); ctx.quadraticCurveTo(0, -bodyH, -bodyL, 0); ctx.quadraticCurveTo(0, bodyH, bodyL, 0); }
  else if (sp.body === 'sword') { ctx.beginPath(); ctx.moveTo(bodyL, 0); ctx.quadraticCurveTo(bodyL * 0.3, -bodyH, -bodyL, 0); ctx.quadraticCurveTo(bodyL * 0.3, bodyH, bodyL, 0); }
  else ellipse(0, 0, bodyL, bodyH);
  ctx.clip();
}

/* ---- 海底氛围元素：海草 / 珊瑚 / 气泡 / 拖尾 ---- */
const corals = [
  { fx: 0.10, fy: 0.93, s: 0.05, c: 'rgba(42,150,158,.26)' },
  { fx: 0.34, fy: 0.96, s: 0.04, c: 'rgba(36,140,150,.22)' },
  { fx: 0.66, fy: 0.94, s: 0.045, c: 'rgba(40,148,155,.24)' },
  { fx: 0.86, fy: 0.95, s: 0.05, c: 'rgba(44,152,160,.26)' },
];
const seaweed = [];
(function initSeaweed() {
  for (let i = 0; i < 16; i++) {
    seaweed.push({
      fx: (i + 0.5) / 16 + rand(-0.015, 0.015),
      hf: rand(0.12, 0.3),
      ph: rand(0, TAU),
      front: i % 2 === 1,
      w: rand(6, 14),
    });
  }
})();

function drawDistantReef() {
  const mounds = [
    { fx: 0.05, w: 0.30, h: 0.12, c: 'rgba(20,100,135,.30)' },
    { fx: 0.48, w: 0.34, h: 0.16, c: 'rgba(16,88,122,.26)' },
    { fx: 0.90, w: 0.28, h: 0.11, c: 'rgba(22,104,140,.28)' },
  ];
  for (const m of mounds) {
    const x = m.fx * W, y = H;
    const r = m.w * W;
    const grad = ctx.createRadialGradient(x, y, r * 0.1, x, y, r);
    grad.addColorStop(0, m.c);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(x - r, y - m.h * H * 2, r * 2, m.h * H * 2);
  }
  // 珊瑚丛（远景模糊感）
  for (const c of corals) {
    const x = c.fx * W, y = c.fy * H, s = c.s * Math.min(W, H);
    ctx.fillStyle = c.c;
    for (let i = -2; i <= 2; i++) {
      const ang = -Math.PI / 2 + i * 0.42;
      const r = s * (1.15 - Math.abs(i) * 0.2);
      ctx.beginPath();
      ctx.arc(x + Math.cos(ang) * r * 0.55, y - Math.sin(ang) * r * 0.35, r * 0.55, 0, TAU);
      ctx.fill();
    }
  }
}

function drawBlade(x, baseY, len, sway, width, color) {
  ctx.fillStyle = color;
  const tipX = x + sway, tipY = baseY - len, cy = baseY - len * 0.55;
  ctx.beginPath();
  ctx.moveTo(x - width * 0.5, baseY);
  ctx.quadraticCurveTo(x - width * 0.5 + sway * 0.4, cy, tipX, tipY);
  ctx.quadraticCurveTo(x + width * 0.5 + sway * 0.4, cy, x + width * 0.5, baseY);
  ctx.closePath();
  ctx.fill();
}

function drawSeaweed(layer) {
  for (const s of seaweed) {
    const isFront = layer === 'front';
    if (s.front !== isFront) continue;
    const x = s.fx * W, baseY = H, len = s.hf * H;
    const t = ambientT * 0.8 + s.ph;
    const sway = Math.sin(t) * len * 0.16;
    if (isFront) {
      drawBlade(x, baseY, len, sway, s.w, 'rgba(20,118,128,.82)');
      drawBlade(x, baseY, len * 0.7, sway * 0.7, s.w * 0.68, 'rgba(26,150,148,.72)');
      drawBlade(x + s.w * 0.6, baseY, len * 0.5, -sway * 0.6, s.w * 0.58, 'rgba(16,102,116,.8)');
    } else {
      drawBlade(x, baseY, len * 0.82, sway, s.w * 0.9, 'rgba(80,196,196,.30)');
    }
  }
}

function drawBubbles() {
  for (const b of bubbles) {
    ctx.fillStyle = 'rgba(255,255,255,.14)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.42)';
    ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.beginPath(); ctx.arc(b.x - b.r * 0.32, b.y - b.r * 0.32, b.r * 0.3, 0, TAU); ctx.fill();
  }
}

function drawTrail(f) {
  const tr = f.trail;
  if (!tr || tr.length < 2) return;
  for (let i = 0; i < tr.length; i++) {
    const p = tr[i], k = i / tr.length;
    ctx.globalAlpha = k * k * 0.2;
    ctx.fillStyle = f.species.c1;
    ctx.beginPath(); ctx.arc(p.x, p.y, f.size * 0.45 * k, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawBackground() {
  // 明亮清新水体渐变（上部浅，向下渐深，非纯色单调）
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#6fd4f0');
  g.addColorStop(0.28, '#3fb6de');
  g.addColorStop(0.6, '#1a92c6');
  g.addColorStop(0.85, '#0f6ea3');
  g.addColorStop(1, '#0a5a8c');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 阳光光束（缓缓移动）
  ctx.save();
  ctx.globalAlpha = 0.12;
  for (let i = 0; i < 5; i++) {
    const lx = ((i * 0.23 + 0.12) * W + ambientT * 12) % (W * 1.4) - W * 0.2;
    const grad = ctx.createLinearGradient(lx - 50, 0, lx + 50, H * 0.9);
    grad.addColorStop(0, '#eafcff'); grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(lx, 0); ctx.lineTo(lx + 130, 0); ctx.lineTo(lx + 40, H * 0.85); ctx.lineTo(lx - 90, H * 0.85);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // 远处礁石珊瑚 + 远处海草（景深）
  drawDistantReef();
  drawSeaweed('back');
}

function drawScene() {
  // 鱼（小的在下层，带拖尾）
  const drawList = [...Game.fishes.filter(f => f.alive), ...Game.players.filter(p => p.alive)];
  drawList.sort((a, b) => a.size - b.size);
  for (const f of drawList) {
    drawTrail(f);
    drawFishBody(f, Game.time);
  }

  // 粒子
  for (const pt of particles) {
    ctx.globalAlpha = clamp(pt.life / pt.max, 0, 1);
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 前景海草（深色，在鱼前面，营造层次）
  drawSeaweed('front');
}

function drawHUD() {
  if (Game.state === 'menu') return;
  const pad = 16;
  const players = Game.players;

  if (Game.mode === 'single') {
    drawPlayerHUD(players[0], pad, pad, '#7fd7ff', true);
  } else {
    drawPlayerHUD(players[0], pad, pad, '#ffd23f', false);
    if (players[1]) drawPlayerHUD(players[1], W - 236 - pad, pad, '#24c26d', false);
    // 合作模式：显示两人总分
    const total = Math.floor(players[0].score + (players[1] ? players[1].score : 0));
    ctx.save();
    ctx.fillStyle = 'rgba(10,55,90,.5)';
    roundRect(W / 2 - 90, pad, 180, 42, 14); ctx.fill();
    ctx.strokeStyle = 'rgba(150,220,255,.28)'; ctx.lineWidth = 1.5;
    roundRect(W / 2 - 90, pad, 180, 42, 14); ctx.stroke();
    ctx.fillStyle = '#ffd23f';
    ctx.font = 'bold 22px "Microsoft YaHei"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('总分 ' + total, W / 2, pad + 21);
    ctx.restore();
  }

  const p0 = players[0];
  if (p0 && p0.combo >= 2 && p0.comboTime > 0) {
    ctx.save();
    ctx.fillStyle = '#ffd23f';
    ctx.font = 'bold 26px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText(`${p0.combo} 连击 x${Game.comboMul(p0).toFixed(1)}`, W / 2, Game.mode === 'single' ? 46 : 78);
    ctx.restore();
  }

  // 威胁方向指示
  for (const p of players) {
    if (!p.alive) continue;
    let threat = null, td = 1e9;
    for (const f of Game.fishes) {
      if (!f.alive || f.size <= p.size * 1.15) continue;
      const d = dist2(p.x, p.y, f.x, f.y);
      if (d < td && d < 620 * 620) { td = d; threat = f; }
    }
    if (threat) {
      const a = Math.atan2(threat.y - p.y, threat.x - p.x);
      const r = 78;
      const col = p.playerIndex === 0 ? '#ffd23f' : '#24c26d';
      ctx.save();
      ctx.globalAlpha = 0.55 + Math.sin(Game.time * 6) * 0.3;
      ctx.fillStyle = '#ff5a5a';
      ctx.beginPath();
      ctx.arc(p.x + Math.cos(a) * r, p.y + Math.sin(a) * r, 11, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = col;
      ctx.font = 'bold 14px "Microsoft YaHei"';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('⚠', p.x + Math.cos(a) * r, p.y + Math.sin(a) * r);
      ctx.restore();
    }
  }
}

function drawPlayerHUD(p, x, y, color, showScore) {
  ctx.save();
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(10,55,90,.5)';
  roundRect(x, y, 220, 74, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(150,220,255,.28)'; ctx.lineWidth = 1.5;
  roundRect(x, y, 220, 74, 14); ctx.stroke();

  const nameColor = color || '#7fd7ff';
  ctx.font = 'bold 18px "Microsoft YaHei"';
  ctx.fillStyle = nameColor;
  ctx.textAlign = 'left';
  ctx.fillText(p.playerIndex === 0 ? 'P1 玩家' : 'P2 玩家', x + 14, y + 10);

  for (let i = 0; i < 3; i++) {
    const hx = x + 14 + i * 22, hy = y + 36;
    if (i < p.lives) { ctx.fillStyle = '#ff4f6e'; heart(hx, hy, 9); ctx.fill(); }
    else { ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1.5; heart(hx, hy, 9); ctx.stroke(); }
  }

  if (showScore) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 15px "Microsoft YaHei"';
    ctx.textAlign = 'right';
    ctx.fillText(Math.floor(p.score) + ' 分', x + 206, y + 38);
  }

  ctx.fillStyle = 'rgba(255,255,255,.2)';
  roundRect(x + 14, y + 58, 192, 6, 3); ctx.fill();
  const growth = clamp((p.size - 10) / 140, 0, 1);
  const gg = ctx.createLinearGradient(x + 14, 0, x + 206, 0);
  gg.addColorStop(0, '#24c26d'); gg.addColorStop(1, '#ffd23f');
  ctx.fillStyle = gg;
  roundRect(x + 14, y + 58, 192 * growth, 6, 3); ctx.fill();
  ctx.restore();
}

function heart(x, y, r) {
  ctx.beginPath();
  ctx.moveTo(x, y + r * 0.3);
  ctx.bezierCurveTo(x, y - r * 0.4, x - r, y - r * 0.4, x - r, y + r * 0.2);
  ctx.bezierCurveTo(x - r, y + r * 0.8, x, y + r * 1.3, x, y + r * 1.6);
  ctx.bezierCurveTo(x, y + r * 1.3, x + r, y + r * 0.8, x + r, y + r * 0.2);
  ctx.bezierCurveTo(x + r, y - r * 0.4, x, y - r * 0.4, x, y + r * 0.3);
  ctx.closePath();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ============================================================
   主循环
   ============================================================ */
let lastT = performance.now();
let ambientT = 0;
function loop(now) {
  const dt = (now - lastT) / 1000;
  lastT = now;
  const adt = Math.min(dt, 0.05);
  ambientT += adt;
  Game.updateBubbles(adt);

  drawBackground();
  drawBubbles();
  if (Game.state === 'play' || Game.state === 'pause') {
    if (Game.state === 'play') Game.update(dt);
    drawScene();
    drawHUD();
  }

  requestAnimationFrame(loop);
}

/* ---------- 按钮水波纹点击反馈 ---------- */
function attachRipple() {
  document.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('pointerdown', e => {
      const rect = btn.getBoundingClientRect();
      const d = Math.max(rect.width, rect.height);
      const span = document.createElement('span');
      span.className = 'ripple';
      span.style.width = span.style.height = d + 'px';
      span.style.left = (e.clientX - rect.left - d / 2) + 'px';
      span.style.top = (e.clientY - rect.top - d / 2) + 'px';
      btn.appendChild(span);
      setTimeout(() => span.remove(), 620);
    });
  });
}
attachRipple();
